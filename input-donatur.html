<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Donatur - Firebase Realtime</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Database Firebase Asia-Southeast Anda
        const firebaseConfig = {
            databaseURL: "https://qris-donasi-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const donationsRef = ref(db, 'donations');

        // Simpan Data Donatur Baru
        document.getElementById('donationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('donorName').value.trim();
            const rawAmount = parseInt(document.getElementById('donorAmount').value);
            const coffee = parseInt(document.getElementById('donorCoffee').value);
            const formattedAmount = 'Rp ' + rawAmount.toLocaleString('id-ID');

            push(donationsRef, {
                name: name,
                amount: formattedAmount,
                coffee: coffee,
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('donationForm').reset();
                document.getElementById('donorCoffee').value = "1";
                alert('Data donatur berhasil dikirim ke Firebase!');
            });
        });

        // Tampilkan List Data secara Real-Time
        onValue(donationsRef, (snapshot) => {
            const listEl = document.getElementById('donorList');
            listEl.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).reverse().forEach((key) => {
                    const item = data[key];
                    const li = document.createElement('li');
                    li.className = 'bg-slate-800/60 p-2.5 rounded-lg flex items-center justify-between border border-slate-700/50';
                    li.innerHTML = `
                        <span class="truncate font-medium text-emerald-400">
                            ${item.name} - <strong class="text-amber-300">${item.amount}</strong>
                        </span>
                        <span class="text-amber-400 font-bold ml-2">☕ ${item.coffee}</span>
                    `;
                    listEl.appendChild(li);
                });
            }
        });

        // Reset Data
        document.getElementById('clearDataBtn').addEventListener('click', () => {
            if (confirm('Hapus seluruh data donasi dari Firebase?')) {
                remove(donationsRef);
            }
        });
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
        <h2 class="text-xl font-bold text-amber-400 border-b border-slate-800 pb-3 flex items-center gap-2">
            <span>🔥</span> Input Data Donatur (Firebase)
        </h2>

        <form id="donationForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Donatur</label>
                <input type="text" id="donorName" required placeholder="Contoh: Hamba Allah" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nominal (Rp)</label>
                    <input type="number" id="donorAmount" required placeholder="50000" 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Jumlah Kopi (☕)</label>
                    <input type="number" id="donorCoffee" value="1" min="1" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg transition-colors text-sm">
                + Simpan ke Firebase
            </button>
        </form>

        <div class="pt-4 border-t border-slate-800">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Live Database Donatur</h3>
                <button id="clearDataBtn" class="text-[10px] text-red-400 hover:underline">Reset All</button>
            </div>
            <ul id="donorList" class="space-y-2 max-h-48 overflow-y-auto text-xs pr-1"></ul>
        </div>
    </div>

</body>
</html>
